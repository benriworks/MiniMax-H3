<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青葉ミニ勉強会 | 操作交代デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#16352d;font-family:'Noto Sans CJK JP',sans-serif}header{padding:18px 5%;background:#123e33;color:white;display:flex;justify-content:space-between;align-items:center}small{letter-spacing:.13em}.badge{background:#dced9f;color:#19392f;border-radius:20px;padding:7px 18px;font-weight:bold}main{max-width:1120px;margin:28px auto;padding:0 24px}.meta{display:flex;justify-content:space-between;font-size:18px;margin-bottom:18px}.paper{background:white;border-radius:18px;padding:36px 46px;box-shadow:0 10px 35px #123e3310;border:1px solid #d5e0d8}label{display:block;color:#567368;font-size:14px;letter-spacing:.1em;margin-bottom:8px}input,textarea{font-family:inherit;color:#143c31;width:100%;border:1px solid #d6e2da;background:#fcfefb;border-radius:8px;padding:14px}input{font-size:36px;font-weight:700;margin-bottom:24px}textarea{font-size:27px;line-height:1.9;resize:vertical;height:300px}input:focus,textarea:focus{outline:3px solid #adcb70}button{font:inherit;font-size:18px;border:0;border-radius:9px;padding:12px 22px;background:#154e3d;color:white;cursor:pointer}.secondary{background:white;border:1px solid #aebfb6;color:#234a3d}.controls{display:flex;gap:12px;margin-top:24px;align-items:center}#status{font-size:17px;margin-left:auto}.hint{color:#62786e;font-size:17px;margin-top:18px}footer{margin-top:24px;font-size:14px;color:#6a7f75}a{color:inherit}</style><header><small>DOTS DESKTOP PILOT / 01</small><span class="badge">デモ環境・架空素材</span></header><main><div class="meta"><strong>文章の操作交代</strong><span>AI の初回出力 → 人が見出しを編集 → 保存</span></div><section class="paper"><label for="heading">見出し（ここを編集できます）</label><input id="heading" value="青葉ミニ勉強会"><label for="body">案内文</label><textarea id="body">11月7日14時から、青葉ミニ勉強会を開催します。

参加は無料、定員は12人です。
皆さまのご参加をお待ちしています。</textarea><div class="controls"><button id="save">編集内容を保存</button><button id="reset" class="secondary">初回版を開く</button><button id="download" class="secondary">テキストを保存</button><span id="status">初回版・編集できます</span></div></section><p class="hint">撮影する変更：「青葉ミニ勉強会」→「青葉ミニ勉強会のご案内」</p><footer>架空の撮影用デモです。実際の開催案内ではありません。保存先はこのブラウザー内のみ。外部送信はしません。</footer></main><script>const key='dots-desktop-pilot-20261025-invitation';const h=document.querySelector('#heading'),b=document.querySelector('#body'),s=document.querySelector('#status');const initial={heading:h.value,body:b.value};try{let v=JSON.parse(localStorage.getItem(key));if(v){h.value=v.heading;b.value=v.body;s.textContent='保存済みの編集内容を再表示';}}catch{}document.querySelector('#save').onclick=()=>{localStorage.setItem(key,JSON.stringify({heading:h.value,body:b.value}));s.textContent='保存しました（ブラウザー内）';};document.querySelector('#reset').onclick=()=>{h.value=initial.heading;b.value=initial.body;s.textContent='初回版・編集できます';h.focus();};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h.value+'\n\n'+b.value+'\n'],{type:'text/plain;charset=utf-8'}));a.download='青葉ミニ勉強会_編集版.txt';a.click();URL.revokeObjectURL(a.href);};</script></html>
