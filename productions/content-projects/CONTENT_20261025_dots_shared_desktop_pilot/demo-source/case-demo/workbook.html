<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dots ローカルXLSXビューア｜デモ環境</title><link rel="stylesheet" href="style.css"><header><div><small>DOTS DESKTOP PILOT</small><h1>dots ローカルXLSXビューア</h1></div><span class="badge">デモ環境</span></header><main><nav><a href="index.html">案件管理</a><a class="active" href="workbook.html">XLSXを開く</a></nav><p class="notice">クラウドPC内の .xlsx を読み取り専用で表示します。Microsoft Excelではありません。</p><section><h2>撮影用の架空案件データ</h2><p class="filemeta">ファイル：demo-cases.xlsx</p><button id="openWorkbook">demo-cases.xlsx を開く</button><div id="workbookResult" hidden><p id="meta" class="filemeta"></p><div class="tablewrap"><table><thead id="headers"></thead><tbody id="rows"></tbody></table></div><div id="total" class="total"></div></div><p class="viewer-note">この画面は登録フォームへ自動入力しません。案件管理画面の入力欄で、内容確認後に登録します。</p><p id="error" role="alert"></p></section><footer>アプリ名：dots ローカルXLSXビューア（Chromium上の独立デモアプリ）／ 外部送信なし</footer></main><script>
document.getElementById('openWorkbook').onclick=async()=>{try{const r=await fetch('/api/workbook');if(!r.ok)throw Error('読み取りに失敗しました');const d=await r.json();const make=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};document.getElementById('headers').replaceChildren();let tr=document.createElement('tr');d.headers.forEach(v=>tr.append(make('th',v)));document.getElementById('headers').append(tr);document.getElementById('rows').replaceChildren();d.rows.forEach(row=>{let tr=document.createElement('tr');row.forEach((v,i)=>{let td=make('td',i===4?v.toLocaleString('ja-JP'):v);if(i===4)td.className='number';tr.append(td)});document.getElementById('rows').append(tr)});document.getElementById('meta').textContent=`実ファイルを読み込み済み：${d.filename} ／ シート：${d.sheet}`;document.getElementById('total').textContent=`3件の合計 ${d.total.toLocaleString('ja-JP')}円`;document.getElementById('workbookResult').hidden=false;}catch(e){document.getElementById('error').textContent=e.message}};
</script></html>
