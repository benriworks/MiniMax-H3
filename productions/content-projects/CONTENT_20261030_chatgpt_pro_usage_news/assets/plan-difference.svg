<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Pro100と500は2倍。Pro200は低い枠のみ2倍、高い枠は維持。Plusは変更なし。"><rect width="1200" height="630" fill="#f4f6f8" stroke="#d8dee4" stroke-width="2"/><g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" fill="#1f2937"><text x="60" y="70" font-size="36" font-weight="700">増える対象は、プランと従来の枠で違う</text><text x="60" y="112" font-size="25" fill="#5b6b7b">Work・Codexの利用枠｜2026年10月29日付公式情報</text><rect x="55" y="155" width="1090" height="80" rx="18" fill="white" stroke="#d8dee4"/><text x="82" y="204" font-size="29">Pro 100 ／ Pro 500</text><text x="680" y="204" font-size="29" fill="#b3543a" font-weight="700">各プランの従来枠 ×2</text><rect x="55" y="255" width="1090" height="80" rx="18" fill="white" stroke="#d8dee4"/><text x="82" y="304" font-size="29">Pro 200：低い枠だった人</text><text x="680" y="304" font-size="29" fill="#b3543a" font-weight="700">高い方にそろうよう ×2</text><rect x="55" y="355" width="1090" height="80" rx="18" fill="white" stroke="#d8dee4"/><text x="82" y="404" font-size="29">Pro 200：高い枠だった人</text><text x="680" y="404" font-size="29" fill="#1f2937" font-weight="700">維持。予定の削減を撤回</text><rect x="55" y="455" width="1090" height="80" rx="18" fill="white" stroke="#d8dee4"/><text x="82" y="504" font-size="29">Plus</text><text x="680" y="504" font-size="29" fill="#5b6b7b" font-weight="700">今回の変更なし</text><text x="60" y="590" font-size="24" fill="#5b6b7b">利用枠の変更。完了できる仕事数が必ず2倍になる保証ではありません。</text></g></svg>